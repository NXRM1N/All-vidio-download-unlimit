name: Build Windows EXE

on:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download static ffmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ffmpeg.exe

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name UniDownload --add-binary "ffmpeg.exe;." main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniDownload-exe
          path: dist/UniDownload.exe
